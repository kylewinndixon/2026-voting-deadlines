<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Voter Registration Deadlines</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #ffffff;
}

h1 {
  text-align:center;
  color:#C92535;
}

#calendar {
  max-width:1200px;
  margin:auto;
}


/* registration colors */

.online {
  background:#C92535;
}

.mail {
  background:#D9A441;
}

.inperson {
  background:#333333;
}


/* popup */

.modal {
  display:none;
  position:fixed;
  z-index:1000;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
}

.modal-content {
  background:white;
  margin:10% auto;
  padding:25px;
  width:80%;
  max-width:600px;
  border-radius:10px;
}

.close {
  float:right;
  font-size:24px;
  cursor:pointer;
}


.badge {
  color:white;
  padding:4px 8px;
  border-radius:5px;
  margin-right:5px;
  font-size:12px;
}


</style>

</head>


<body>

<h1>Voter Registration Deadlines</h1>

<div id="calendar"></div>


<div id="popup" class="modal">

<div class="modal-content">

<span class="close">&times;</span>

<div id="popupText"></div>

</div>

</div>



<script>


const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRIAU4CfDAlRhv0zDxdZngiqbdavP3sga8lvqxcinP3gjhvHtM2v6vPJbPGc6PZHCmMLFijZ_oDYrZX/pub?gid=1156287616&single=true&output=csv";



let deadlineData = {};



Papa.parse(csvURL, {

download:true,

header:true,

complete:function(results){


results.data.forEach(row=>{


if(!row.State || !row.Deadline) return;


let date =
new Date(row.Deadline);



let key =
date.toISOString().split("T")[0];



if(!deadlineData[key]){
deadlineData[key]={};
}



if(!deadlineData[key][row.State]){
deadlineData[key][row.State]=[];
}



deadlineData[key][row.State].push(row);


});



createCalendar();


}

});





function createCalendar(){


let calendarEl =
document.getElementById("calendar");



let calendar =
new FullCalendar.Calendar(calendarEl, {


initialView:"dayGridMonth",

initialDate:"2026-09-01",


events:Object.keys(deadlineData).map(date=>({

title:
Object.keys(deadlineData[date]).join(", "),

start:date,

extendedProps:{
details:deadlineData[date]
}


})),


eventClick:function(info){


let html="";



let states =
info.event.extendedProps.details;



Object.keys(states).forEach(state=>{


html += "<h2>"+state+"</h2>";



states[state].forEach(item=>{


html +=
`
<p>
<strong>${item["Registration Type"]}</strong><br>

Deadline:
${item.Deadline}<br>

${item.Notes || ""}

<br>

<a href="${item.Link}" target="_blank">
Register here
</a>

</p>
`;

});


});


document.getElementById("popupText").innerHTML=html;


document.getElementById("popup").style.display="block";


}



});


calendar.render();


}





document.querySelector(".close").onclick=function(){

document.getElementById("popup").style.display="none";

}


</script>


</body>

</html>
