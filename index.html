<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Registration Deadlines</title>

    <!-- Converts the published Google Sheet CSV into usable data -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* ==================================================
           CUSTOMIZABLE SETTINGS
           Most visual changes can be made here.
        ================================================== */

        :root {
            /* Stanford Votes palette */
            --cream: #F2EEDF;
            --blue: #5D8AA8;
            --red: #DE5452;
            --gold: #F4B942;
            --charcoal: #1F2430;
            --muted-text: #505761;

            /* Calendar appearance */
            --day-background: #FFFFFF;
            --day-border: #D8D3C4;
            --day-radius: 6px;
            --day-gap: 5px;
            --month-gap: 34px;
            --day-height: 130px;

            /* Deadline-type colors */
            --online-color: var(--red);
            --mail-color: var(--gold);
            --in-person-color: var(--blue);
            --election-day-color: var(--red);
            --other-color: var(--muted-text);
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--cream);
        }

        body {
            margin: 0;
            padding: 20px;
            color: var(--charcoal);
            background: var(--cream);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        /* ==================================================
           CALENDAR LAYOUT
        ================================================== */

        #calendar-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .month-section {
            margin-bottom: var(--month-gap);
        }

        .month-section:last-child {
            margin-bottom: 0;
        }

        /*
         * There is no border or rounded outline around an entire month.
         * Only actual date cells have borders.
         */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: var(--day-gap);
        }

        .calendar-day {
            min-width: 0;
            min-height: var(--day-height);
            padding: 8px;
            overflow: hidden;
            background: var(--day-background);
            border: 1px solid var(--day-border);
            border-radius: var(--day-radius);
            transition:
                background 140ms ease,
                border-color 140ms ease;
        }

        .calendar-day:hover {
            background: rgba(242, 238, 223, 0.55);
            border-color: var(--blue);
        }

        /*
         * Empty spaces preserve the correct weekday positions.
         * They have no background, border, date, or content.
         */
        .calendar-placeholder {
            min-height: var(--day-height);
            background: transparent;
            border: 0;
            pointer-events: none;
        }

        .day-number {
            display: block;
            margin-bottom: 7px;
            color: var(--muted-text);
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* ==================================================
           STATES AND TYPE MARKERS
        ================================================== */

        .state-list {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
        }

        .state-button {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 2px 0;
            color: var(--charcoal);
            background: transparent;
            border: 0;
            cursor: pointer;
            text-align: left;
        }

        .state-name {
            display: block;
            overflow: hidden;
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .state-button:hover .state-name,
        .state-button:focus-visible .state-name {
            color: var(--blue);
            text-decoration: underline;
        }

        .state-button:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
            border-radius: 3px;
        }

        .type-markers {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 3px;
        }

        .type-marker {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
        }

        /* ==================================================
           ELECTION DAY
        ================================================== */

        .calendar-day.election-day {
            background: rgba(244, 185, 66, 0.2);
            border: 2px solid var(--gold);
        }

        .calendar-day.election-day:hover {
            background: rgba(244, 185, 66, 0.3);
            border-color: var(--red);
        }

        .election-day .day-number {
            color: var(--red);
        }

        .election-banner {
            margin-bottom: 7px;
            padding: 4px 6px;
            color: white;
            background: var(--red);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
        }

        /* ==================================================
           POPUP
        ================================================== */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            padding: 24px;
            overflow-y: auto;
            background: rgba(31, 36, 48, 0.65);
        }

        .modal.is-open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            width: min(100%, 620px);
            max-height: calc(100vh - 48px);
            margin: auto;
            padding: 28px;
            overflow-y: auto;
            background: var(--cream);
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(31, 36, 48, 0.25);
        }

        .close-button {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 36px;
            height: 36px;
            padding: 0;
            color: var(--charcoal);
            background: transparent;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.7rem;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus-visible {
            background: rgba(31, 36, 48, 0.08);
        }

        .popup-state {
            margin: 0 42px 4px 0;
            color: var(--charcoal);
            font-size: 1.65rem;
        }

        .popup-date {
            margin: 0 0 22px;
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        .deadline-entry {
            --type-color: var(--other-color);

            margin-bottom: 16px;
            padding: 13px 14px;
            background: rgba(255, 255, 255, 0.68);
            border-left: 5px solid var(--type-color);
            border-radius: 7px;
        }

        .deadline-entry:last-child {
            margin-bottom: 0;
        }

        .deadline-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
            margin-bottom: 6px;
        }

        .deadline-badge {
            display: inline-block;
            padding: 4px 9px;
            color: white;
            background: var(--type-color);
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /*
         * Gold is light, so mail badges use dark text.
         */
        .deadline-badge.dark-text {
            color: var(--charcoal);
        }

        .more-info-link {
            color: var(--blue);
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
        }

        .more-info-link:hover,
        .more-info-link:focus-visible {
            color: var(--red);
            text-decoration: underline;
        }

        .deadline-date {
            margin: 0;
            line-height: 1.4;
        }

        .deadline-notes {
            margin: 5px 0 0;
            color: var(--muted-text);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* ==================================================
           STATUS MESSAGES
        ================================================== */

        .loading-message,
        .error-message {
            padding: 30px;
            text-align: center;
        }

        .error-message {
            color: var(--red);
            font-weight: 700;
        }

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 750px) {
            :root {
                --day-height: 95px;
                --day-gap: 3px;
                --month-gap: 25px;
            }

            body {
                padding: 10px;
            }

            .calendar-day {
                padding: 5px;
                border-radius: 4px;
            }

            .day-number {
                margin-bottom: 4px;
                font-size: 0.72rem;
            }

            .state-list {
                gap: 3px;
            }

            .state-name {
                font-size: 0.66rem;
            }

            .type-markers {
                gap: 3px;
                margin-top: 2px;
            }

            .type-marker {
                width: 6px;
                height: 6px;
            }

            .election-banner {
                padding: 3px;
                font-size: 0.58rem;
            }

            .modal {
                padding: 12px;
            }

            .modal-content {
                max-height: calc(100vh - 24px);
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>
    <main id="calendar-container">
        <div class="loading-message">
            Loading registration deadlines…
        </div>
    </main>

    <div
        id="popup"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="popup-state"
    >
        <div class="modal-content">
            <button
                id="close-popup"
                class="close-button"
                type="button"
                aria-label="Close popup"
            >
                &times;
            </button>

            <div id="popup-content"></div>
        </div>
    </div>

    <script>
        /* ==================================================
           CALENDAR SETTINGS
        ================================================== */

        /*
         * JavaScript months use zero-based numbering:
         *
         * 8  = September
         * 9  = October
         * 10 = November
         *
         * Set lastDay to null to display the full month.
         * Set it to a number to stop early.
         */
        const displayedMonths = [
            {
                year: 2026,
                month: 8,
                lastDay: null
            },
            {
                year: 2026,
                month: 9,
                lastDay: null
            },
            {
                year: 2026,
                month: 10,
                lastDay: 7
            }
        ];

        /*
         * Special dates receive extra calendar styling.
         * Additional dates can be added later using the same format.
         */
        const specialDates = {
            "2026-11-03": {
                label: "Election Day",
                className: "election-day"
            }
        };

        /*
         * Published CSV link for the Calendar Data tab.
         */
        const csvURL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRIAU4CfDAlRhv0zDxdZngiqbdavP3sga8lvqxcinP3gjhvHtM2v6vPJbPGc6PZHCmMLFijZ_oDYrZX/pub?gid=1156287616&single=true&output=csv";

        const deadlineData = {};

        /* ==================================================
           LOAD THE GOOGLE SHEET
        ================================================== */

        Papa.parse(csvURL, {
            download: true,
            header: true,
            skipEmptyLines: true,

            complete(results) {
                processSpreadsheetRows(results.data);
                renderCalendar();
            },

            error(error) {
                console.error("CSV loading error:", error);
                showLoadingError();
            }
        });

        /* ==================================================
           PROCESS SPREADSHEET ROWS
        ================================================== */
        const stateAbbreviations = {
            Alabama: "AL",
            Alaska: "AK",
            Arizona: "AZ",
            Arkansas: "AR",
            California: "CA",
            Colorado: "CO",
            Connecticut: "CT",
            Delaware: "DE",
            District of Columbia: "DC",
            Florida: "FL",
            Georgia: "GA",
            Hawaii: "HI",
            Idaho: "ID",
            Illinois: "IL",
            Indiana: "IN",
            Iowa: "IA",
            Kansas: "KS",
            Kentucky: "KY",
            Louisiana: "LA",
            Maine: "ME",
            Maryland: "MD",
            Massachusetts: "MA",
            Michigan: "MI",
            Minnesota: "MN",
            Mississippi: "MS",
            Missouri: "MO",
            Montana: "MT",
            Nebraska: "NE",
            Nevada: "NV",
            New Hampshire: "NH",
            New Jersey: "NJ",
            New Mexico: "NM",
            New York: "NY",
            North Carolina: "NC",
            North Dakota: "ND",
            Ohio: "OH",
            Oklahoma: "OK",
            Oregon: "OR",
            Pennsylvania: "PA",
            Rhode Island: "RI",
            South Carolina: "SC",
            South Dakota: "SD",
            Tennessee: "TN",
            Texas: "TX",
            Utah: "UT",
            Vermont: "VT",
            Virginia: "VA",
            Washington: "WA",
            West Virginia: "WV",
            Wisconsin: "WI",
            Wyoming: "WY"
        };

        
        function processSpreadsheetRows(rows) {
            rows.forEach(row => {
                const state = String(row.State || "").trim();

                const registrationType = String(
                    row["Registration Type"] || ""
                ).trim();

                const deadline = String(row.Deadline || "").trim();

                if (!state || !registrationType || !deadline) {
                    return;
                }

                const parsedDate = parseSpreadsheetDate(deadline);

                if (!parsedDate) {
                    console.warn(
                        "Skipped row with invalid deadline:",
                        deadline,
                        row
                    );

                    return;
                }

                const dateKey = createDateKey(
                    parsedDate.year,
                    parsedDate.month,
                    parsedDate.day
                );

                if (!deadlineData[dateKey]) {
                    deadlineData[dateKey] = {};
                }

                if (!deadlineData[dateKey][state]) {
                    deadlineData[dateKey][state] = [];
                }

                deadlineData[dateKey][state].push({
                    ...row,
                    State: state,
                    "Registration Type": registrationType,
                    Deadline: deadline
                });
            });
        }

        /*
         * Reads Google Sheet dates in M/D/YYYY or MM/DD/YYYY format.
         * Parsing the numbers manually prevents timezone date shifts.
         */
        function parseSpreadsheetDate(value) {
            const match = value.match(
                /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/
            );

            if (!match) {
                return null;
            }

            const month = Number(match[1]) - 1;
            const day = Number(match[2]);
            const year = Number(match[3]);

            const testDate = new Date(year, month, day);

            if (
                testDate.getFullYear() !== year ||
                testDate.getMonth() !== month ||
                testDate.getDate() !== day
            ) {
                return null;
            }

            return {
                year,
                month,
                day
            };
        }

        function createDateKey(year, month, day) {
            const paddedMonth = String(month + 1).padStart(2, "0");
            const paddedDay = String(day).padStart(2, "0");

            return `${year}-${paddedMonth}-${paddedDay}`;
        }

        /* ==================================================
           RENDER THE CALENDAR
        ================================================== */

        function renderCalendar() {
            const container = document.getElementById(
                "calendar-container"
            );

            container.innerHTML = "";

            displayedMonths.forEach(monthSettings => {
                container.appendChild(
                    createMonthSection(monthSettings)
                );
            });

            notifyParentOfHeight();
        }

        function createMonthSection(settings) {
            const section = document.createElement("section");
            section.className = "month-section";

            const grid = document.createElement("div");
            grid.className = "month-grid";

            const firstWeekday = new Date(
                settings.year,
                settings.month,
                1
            ).getDay();

            const naturalLastDay = new Date(
                settings.year,
                settings.month + 1,
                0
            ).getDate();

            const displayedLastDay =
                settings.lastDay === null
                    ? naturalLastDay
                    : settings.lastDay;

            /*
             * Add invisible spaces before the first date so each
             * date remains in its correct Sunday–Saturday column.
             */
            for (let i = 0; i < firstWeekday; i += 1) {
                grid.appendChild(createPlaceholder());
            }

            for (
                let day = 1;
                day <= displayedLastDay;
                day += 1
            ) {
                grid.appendChild(
                    createDayCell(
                        settings.year,
                        settings.month,
                        day
                    )
                );
            }

            /*
             * Complete the last row with invisible spaces.
             */
            const occupiedPositions =
                firstWeekday + displayedLastDay;

            const trailingPositions =
                (7 - (occupiedPositions % 7)) % 7;

            for (
                let i = 0;
                i < trailingPositions;
                i += 1
            ) {
                grid.appendChild(createPlaceholder());
            }

            section.appendChild(grid);

            return section;
        }

        function createPlaceholder() {
            const placeholder = document.createElement("div");

            placeholder.className = "calendar-placeholder";
            placeholder.setAttribute("aria-hidden", "true");

            return placeholder;
        }

        function createDayCell(year, month, day) {
            const dateKey = createDateKey(year, month, day);
            const states = deadlineData[dateKey] || {};
            const specialDate = specialDates[dateKey];

            const cell = document.createElement("div");
            cell.className = "calendar-day";

            if (specialDate) {
                cell.classList.add(specialDate.className);
            }

            const number = document.createElement("span");
            number.className = "day-number";
            number.textContent = day;

            cell.appendChild(number);

            if (specialDate) {
                const banner = document.createElement("div");

                banner.className = "election-banner";
                banner.textContent = specialDate.label;

                cell.appendChild(banner);
            }

            const stateList = document.createElement("div");
            stateList.className = "state-list";

            Object.keys(states)
                .sort((first, second) =>
                    first.localeCompare(second)
                )
                .forEach(state => {
                    stateList.appendChild(
                        createStateButton(
                            dateKey,
                            state,
                            states[state]
                        )
                    );
                });

            cell.appendChild(stateList);

            return cell;
        }

        function createStateButton(dateKey, state, entries) {
            const button = document.createElement("button");
            const stateName = document.createElement("span");
            const markerContainer =
                document.createElement("span");

            button.type = "button";
            button.className = "state-button";
            button.title =
                `View ${state} registration deadlines`;

            stateName.className = "state-name";
            stateName.textContent =
                window.innerWidth <= 750
                    ? stateAbbreviations[state]
                    : state;

            markerContainer.className = "type-markers";

            getUniqueTypeStyles(entries).forEach(typeStyle => {
                const marker = document.createElement("span");

                marker.className = "type-marker";
                marker.style.backgroundColor = typeStyle.color;
                marker.title = typeStyle.label;
                marker.setAttribute(
                    "aria-label",
                    typeStyle.label
                );

                markerContainer.appendChild(marker);
            });

            button.append(stateName, markerContainer);

            button.addEventListener("click", () => {
                openStatePopup(dateKey, state, entries);
            });

            return button;
        }

        /* ==================================================
           REGISTRATION-TYPE APPEARANCE
        ================================================== */

        function normalizeRegistrationType(type) {
            return String(type)
                .trim()
                .toLowerCase()
                .replace(/[-_]+/g, " ")
                .replace(/\s+/g, " ");
        }

        function getTypeStyle(type) {
            const normalizedType =
                normalizeRegistrationType(type);

            const styles = {
                online: {
                    color: getCssVariable("--online-color"),
                    label: "Online",
                    darkText: false,
                    order: 1
                },

                mail: {
                    color: getCssVariable("--mail-color"),
                    label: "Mail",
                    darkText: true,
                    order: 2
                },

                "in person": {
                    color: getCssVariable("--in-person-color"),
                    label: "In Person",
                    darkText: false,
                    order: 3
                },

                "election day": {
                    color: getCssVariable(
                        "--election-day-color"
                    ),
                    label: "Election Day",
                    darkText: false,
                    order: 4
                }
            };

            return (
                styles[normalizedType] || {
                    color: getCssVariable("--other-color"),
                    label: formatTypeName(type),
                    darkText: false,
                    order: 99
                }
            );
        }

        function getUniqueTypeStyles(entries) {
            const uniqueStyles = new Map();

            entries.forEach(entry => {
                const type =
                    entry["Registration Type"];

                const normalizedType =
                    normalizeRegistrationType(type);

                if (!uniqueStyles.has(normalizedType)) {
                    uniqueStyles.set(
                        normalizedType,
                        getTypeStyle(type)
                    );
                }
            });

            return [...uniqueStyles.values()].sort(
                (first, second) =>
                    first.order - second.order
            );
        }

        function getCssVariable(variableName) {
            return getComputedStyle(
                document.documentElement
            )
                .getPropertyValue(variableName)
                .trim();
        }

        /* ==================================================
           POPUP
        ================================================== */

        function openStatePopup(dateKey, state, entries) {
            const popup = document.getElementById("popup");

            const popupContent = document.getElementById(
                "popup-content"
            );

            const dateLabel = formatDateKey(dateKey);

            const sortedEntries = [...entries].sort(
                compareRegistrationTypes
            );

            let html = `
                <h2 id="popup-state" class="popup-state">
                    ${escapeHTML(state)}
                </h2>

                <p class="popup-date">
                    ${escapeHTML(dateLabel)}
                </p>
            `;

            sortedEntries.forEach(item => {
                const typeStyle = getTypeStyle(
                    item["Registration Type"]
                );

                const notes = String(
                    item.Notes || ""
                ).trim();

                const safeLink = getSafeLink(item.Link);

                html += `
                    <div
                        class="deadline-entry"
                        style="--type-color: ${typeStyle.color};"
                    >
                        <div class="deadline-heading">
                            <span
                                class="deadline-badge ${
                                    typeStyle.darkText
                                        ? "dark-text"
                                        : ""
                                }"
                            >
                                ${escapeHTML(typeStyle.label)}
                            </span>

                            ${
                                safeLink
                                    ? `
                                        <a
                                            class="more-info-link"
                                            href="${escapeAttribute(safeLink)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            (More Info)
                                        </a>
                                    `
                                    : ""
                            }
                        </div>

                        <p class="deadline-date">
                            <strong>Deadline:</strong>
                            ${escapeHTML(item.Deadline)}
                        </p>

                        ${
                            notes
                                ? `
                                    <p class="deadline-notes">${escapeHTML(notes)}</p>
                                `
                                : ""
                        }
                    </div>
                `;
            });

            popupContent.innerHTML = html;
            popup.classList.add("is-open");

            document.body.style.overflow = "hidden";

            document
                .getElementById("close-popup")
                .focus();
        }

        function compareRegistrationTypes(first, second) {
            const firstStyle = getTypeStyle(
                first["Registration Type"]
            );

            const secondStyle = getTypeStyle(
                second["Registration Type"]
            );

            return firstStyle.order - secondStyle.order;
        }

        function formatTypeName(type) {
            return normalizeRegistrationType(type)
                .split(" ")
                .map(word =>
                    word.charAt(0).toUpperCase() +
                    word.slice(1)
                )
                .join(" ");
        }

        function formatDateKey(dateKey) {
            const [year, month, day] =
                dateKey.split("-").map(Number);

            return new Intl.DateTimeFormat("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            }).format(
                new Date(year, month - 1, day)
            );
        }

        function closePopup() {
            document
                .getElementById("popup")
                .classList.remove("is-open");

            document.body.style.overflow = "";
        }

        document
            .getElementById("close-popup")
            .addEventListener("click", closePopup);

        document
            .getElementById("popup")
            .addEventListener("click", event => {
                if (event.target.id === "popup") {
                    closePopup();
                }
            });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closePopup();
            }
        });

        /* ==================================================
           WIX EMBED HEIGHT SUPPORT
        ================================================== */

        /*
         * This reports the page height to a parent window.
         * It does not interfere with a normal Wix URL embed.
         * It can also support a future Velo auto-resizing setup.
         */
        function notifyParentOfHeight() {
            const height =
                document.documentElement.scrollHeight;

            window.parent.postMessage(
                {
                    type: "voter-calendar-height",
                    height
                },
                "*"
            );
        }

        if ("ResizeObserver" in window) {
            const resizeObserver = new ResizeObserver(() => {
                notifyParentOfHeight();
            });

            resizeObserver.observe(document.body);
        }

        window.addEventListener(
            "load",
            notifyParentOfHeight
        );

        /* ==================================================
           ERROR HANDLING AND SECURITY
        ================================================== */

        function showLoadingError() {
            document.getElementById(
                "calendar-container"
            ).innerHTML = `
                <div class="error-message">
                    The registration deadlines could not be loaded.
                    Please refresh the page.
                </div>
            `;
        }

        function getSafeLink(value) {
            const link = String(value || "").trim();

            if (!link) {
                return "";
            }

            try {
                const parsedURL = new URL(link);

                if (
                    parsedURL.protocol === "https:" ||
                    parsedURL.protocol === "http:"
                ) {
                    return parsedURL.href;
                }
            } catch (error) {
                console.warn("Invalid link skipped:", link);
            }

            return "";
        }

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHTML(
                String(value || "").trim()
            );
        }
    </script>
</body>
