<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Registration Deadlines</title>

    <!-- Reads the published Google Sheet CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* =========================
           Customizable colors/layout
        ========================= */

        :root {
            --cream: #F2EEDF;
            --blue: #5D8AA8;
            --red: #DE5452;
            --gold: #F4B942;
            --charcoal: #1F2430;
            --muted-text: #505761;

            --calendar-border: #D8D3C4;
            --day-background: #FFFFFF;

            /* Change this to increase/decrease space between months */
            --month-gap: 34px;

            /* Registration-type colors */
            --online-color: var(--red);
            --mail-color: var(--gold);
            --in-person-color: var(--blue);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--charcoal);
            background: var(--cream);
        }

        button,
        a {
            font: inherit;
        }

        /* =========================
           Main calendar layout
        ========================= */

        #calendar-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .month-section {
            margin-bottom: var(--month-gap);
        }

        .month-section:last-child {
            margin-bottom: 0;
        }

        /* Actual days belonging to the displayed month */
        .calendar-day {
            min-height: 130px;
            padding: 8px;
            overflow: hidden;
            background: var(--day-background);
            border-right: 1px solid var(--calendar-border);
            border-bottom: 1px solid var(--calendar-border);
        }
        
        .calendar-day:hover {
            background: rgba(242, 238, 223, 0.45);
        }
        /*
         * Empty positions before/after a month.
         * These contain no date and have no visible calendar border.
         */
        .calendar-placeholder {
            min-height: 130px;
            background: transparent;
            border: 0;
        }

        .day-number {
            display: block;
            margin-bottom: 7px;
            color: var(--muted-text);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .state-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        /*
         * State names are buttons.
         * Their text color reflects the registration types on that date.
         */
        .state-button {
            display: block;
            width: 100%;
            padding: 3px 0;
            overflow: hidden;
            color: var(--charcoal);
            background: transparent;
            border: 0;
            cursor: pointer;
            text-align: left;
        }
        
        .state-name {
            display: block;
            overflow: hidden;
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .state-button:hover .state-name,
        .state-button:focus-visible .state-name {
            color: var(--blue);
            text-decoration: underline;
        }
        
        .type-markers {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }
        
        .type-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .loading-message,
        .error-message {
            padding: 30px;
            text-align: center;
        }

        .error-message {
            color: var(--red);
            font-weight: 700;
        }

        /* =========================
           Popup
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            padding: 24px;
            overflow-y: auto;
            background: rgba(31, 36, 48, 0.65);
        }

        .modal.is-open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            width: min(100%, 620px);
            max-height: calc(100vh - 48px);
            margin: auto;
            padding: 28px;
            overflow-y: auto;
            background: var(--cream);
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(31, 36, 48, 0.25);
        }

        .close-button {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 36px;
            height: 36px;
            padding: 0;
            color: var(--charcoal);
            background: transparent;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.7rem;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus-visible {
            background: rgba(31, 36, 48, 0.08);
        }

        .popup-state {
            margin: 0 42px 4px 0;
            color: var(--charcoal);
            font-size: 1.65rem;
        }

        .popup-date {
            margin: 0 0 22px;
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        .deadline-entry {
            --type-color: var(--blue);

            margin-bottom: 16px;
            padding: 13px 14px;
            background: rgba(255, 255, 255, 0.65);
            border-left: 5px solid var(--type-color);
            border-radius: 7px;
        }

        .deadline-entry:last-child {
            margin-bottom: 0;
        }

        .deadline-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .deadline-badge {
            display: inline-block;
            padding: 4px 9px;
            color: white;
            background: var(--type-color);
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .deadline-badge.mail-badge {
            color: var(--charcoal);
        }

        .more-info-link {
            color: var(--blue);
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
        }

        .more-info-link:hover,
        .more-info-link:focus-visible {
            color: var(--red);
            text-decoration: underline;
        }

        .deadline-date {
            margin: 0;
            line-height: 1.4;
        }

        .deadline-notes {
            margin: 4px 0 0;
            color: var(--muted-text);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* =========================
           Mobile adjustments
        ========================= */

        @media (max-width: 750px) {
            body {
                padding: 10px;
            }

            .calendar-day,
            .calendar-placeholder {
                min-height: 95px;
            }

            .calendar-day {
                padding: 5px;
            }

            .day-number {
                margin-bottom: 4px;
                font-size: 0.75rem;
            }

            .state-list {
                gap: 3px;
            }

            .state-button {
                font-size: 0.68rem;
            }

            .modal {
                padding: 12px;
            }

            .modal-content {
                max-height: calc(100vh - 24px);
                padding: 22px 18px;
            }
        }
        
        .election-day {
            background: rgba(244, 185, 66, 0.18);
        }
        
        .election-day .day-number {
            color: var(--red);
            font-weight: bold;
        }

        .election-banner {
            margin-bottom: 6px;
            padding: 3px 6px;
        
            background: var(--red);
            color: white;
        
            border-radius: 4px;
        
            font-size: 0.7rem;
            font-weight: bold;
        
            text-align: center;
        }
        .election-info {

            margin-bottom: 20px;
            padding: 16px;
        
            background: rgba(244, 185, 66, 0.18);
        
            border-left: 5px solid var(--gold);
        
            border-radius: 8px;
        
        }
        
        .election-info h3 {
            margin-top: 0;
            color: var(--red);
        }
        
        .election-info ul {
            margin: 10px 0 0;
            padding-left: 20px;
            columns: 2;
        }
        
    </style>
</head>

<body>
    <main id="calendar-container">
        <div class="loading-message">Loading registration deadlines…</div>
    </main>

    <div
        id="popup"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="popup-state"
    >
        <div class="modal-content">
            <button
                id="close-popup"
                class="close-button"
                type="button"
                aria-label="Close popup"
            >
                &times;
            </button>

            <div id="popup-content"></div>
        </div>
    </div>

    <script>
        /* =========================
           Customizable calendar dates
        ========================= */

        /*
         * lastDay controls how much of each month is displayed.
         *
         * September and October use null, meaning the full month.
         * November uses 7, meaning only November 1–7 appears.
         */
        const displayedMonths = [
            {
                year: 2026,
                month: 8,
                name: "September 2026",
                lastDay: null
            },
            {
                year: 2026,
                month: 9,
                name: "October 2026",
                lastDay: null
            },
            {
                year: 2026,
                month: 10,
                name: "November 2026",
                lastDay: 7
            }
        ];

        const csvURL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRIAU4CfDAlRhv0zDxdZngiqbdavP3sga8lvqxcinP3gjhvHtM2v6vPJbPGc6PZHCmMLFijZ_oDYrZX/pub?gid=1156287616&single=true&output=csv";

        const sameDayRegistrationStates = [
            "Colorado",
            "Connecticut",
            "District of Columbia",
            "Hawaii",
            "Iowa",
            "Maine",
            "Maryland",
            "Michigan",
            "Minnesota",
            "Montana",
            "Nevada",
            "New Hampshire",
            "North Dakota",
            "Utah",
            "Vermont",
            "Virginia",
            "Washington",
            "Wisconsin",
            "Wyoming"
        ];
        
        const deadlineData = {};

        Papa.parse(csvURL, {
            download: true,
            header: true,
            skipEmptyLines: true,

            complete(results) {
                processSpreadsheetRows(results.data);
                renderCalendar();
            },

            error(error) {
                console.error("CSV loading error:", error);
                showLoadingError();
            }
        });

        /* =========================
           Spreadsheet processing
        ========================= */

        function processSpreadsheetRows(rows) {
            rows.forEach(row => {
                const state = String(row.State || "").trim();
                const registrationType = String(
                    row["Registration Type"] || ""
                ).trim();
                const deadline = String(row.Deadline || "").trim();

                if (!state || !registrationType || !deadline) {
                    return;
                }

                const parsedDate = parseSpreadsheetDate(deadline);

                if (!parsedDate) {
                    console.warn("Skipped invalid deadline:", deadline, row);
                    return;
                }

                const dateKey = createDateKey(
                    parsedDate.year,
                    parsedDate.month,
                    parsedDate.day
                );

                if (!deadlineData[dateKey]) {
                    deadlineData[dateKey] = {};
                }

                if (!deadlineData[dateKey][state]) {
                    deadlineData[dateKey][state] = [];
                }

                deadlineData[dateKey][state].push({
                    ...row,
                    State: state,
                    "Registration Type": registrationType,
                    Deadline: deadline
                });
            });
        }

        /*
         * Reads dates written as M/D/YYYY or MM/DD/YYYY.
         * This avoids timezone shifts caused by new Date("10/5/2026").
         */
        function parseSpreadsheetDate(value) {
            const match = value.match(
                /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/
            );

            if (!match) {
                return null;
            }

            const month = Number(match[1]) - 1;
            const day = Number(match[2]);
            const year = Number(match[3]);

            const date = new Date(year, month, day);

            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month ||
                date.getDate() !== day
            ) {
                return null;
            }

            return { year, month, day };
        }

        function createDateKey(year, month, day) {
            const paddedMonth = String(month + 1).padStart(2, "0");
            const paddedDay = String(day).padStart(2, "0");

            return `${year}-${paddedMonth}-${paddedDay}`;
        }

        /* =========================
           Calendar rendering
        ========================= */

        function renderCalendar() {
            const container = document.getElementById(
                "calendar-container"
            );
        
            container.innerHTML = "";
        
            displayedMonths.forEach(monthSettings => {
                container.appendChild(
                    createMonthSection(monthSettings)
                );
            });
        }

        function createMonthSection(settings) {
            const section = document.createElement("section");
            section.className = "month-section";

            const grid = document.createElement("div");
            grid.className = "month-grid";

            const firstWeekday = new Date(
                settings.year,
                settings.month,
                1
            ).getDay();

            const naturalLastDay = new Date(
                settings.year,
                settings.month + 1,
                0
            ).getDate();

            const displayedLastDay =
                settings.lastDay || naturalLastDay;

            /*
             * Black placeholder positions before the first date.
             * These have no date, text, or visible border.
             */
            for (let i = 0; i < firstWeekday; i += 1) {
                grid.appendChild(createPlaceholder());
            }

            for (
                let day = 1;
                day <= displayedLastDay;
                day += 1
            ) {
                grid.appendChild(
                    createDayCell(
                        settings.year,
                        settings.month,
                        day
                    )
                );
            }

            /*
             * Add enough black placeholders to finish the final row.
             * October 2026 naturally ends on Saturday, so it receives none.
             */
            const occupiedPositions =
                firstWeekday + displayedLastDay;

            const trailingPositions =
                (7 - (occupiedPositions % 7)) % 7;

            for (let i = 0; i < trailingPositions; i += 1) {
                grid.appendChild(createPlaceholder());
            }

            section.appendChild(grid);
           
            return section;
        }

        function createPlaceholder() {
            const placeholder = document.createElement("div");
            placeholder.className = "calendar-placeholder";
            placeholder.setAttribute("aria-hidden", "true");

            return placeholder;
        }

        function createDayCell(year, month, day) {
            const dateKey = createDateKey(year, month, day);
            const states = deadlineData[dateKey] || {};

            const cell = document.createElement("div");
            cell.className = "calendar-day";

            const number = document.createElement("span");
            number.className = "day-number";
            number.textContent = day;

            const isElectionDay =
                year === 2026 &&
                month === 10 &&
                day === 3;
            
            if (isElectionDay) {
                cell.classList.add("election-day");
                
                const banner = document.createElement("div");

                banner.className = "election-banner";
            
                banner.textContent = "Election Day";
            
                cell.appendChild(banner);
            }
            
            const stateList = document.createElement("div");
            stateList.className = "state-list";

            Object.keys(states)
                .sort((a, b) => a.localeCompare(b))
                .forEach(state => {
                    stateList.appendChild(
                        createStateButton(
                            dateKey,
                            state,
                            states[state]
                        )
                    );
                });

            cell.append(number, stateList);

            return cell;
        }

        function createStateButton(dateKey, state, entries) {
            const button = document.createElement("button");
            const stateName = document.createElement("span");
            const markerContainer = document.createElement("span");
            const colors = getUniqueTypeColors(entries);
        
            button.type = "button";
            button.className = "state-button";
            button.title = `View ${state} registration deadlines`;
        
            stateName.className = "state-name";
            stateName.textContent = state;
        
            markerContainer.className = "type-markers";
        
            colors.forEach(color => {
                const marker = document.createElement("span");
        
                marker.className = "type-marker";
                marker.style.backgroundColor = color;
        
                markerContainer.appendChild(marker);
            });
        
            button.append(stateName, markerContainer);
        
            button.addEventListener("click", () => {
                openStatePopup(dateKey, state, entries);
            });
        
            return button;
        }

        /* =========================
           Registration-type colors
        ========================= */

        function normalizeRegistrationType(type) {
            return String(type)
                .trim()
                .toLowerCase()
                .replace(/[-_]+/g, " ")
                .replace(/\s+/g, " ");
        }

        function getTypeColor(type) {
            const normalizedType =
                normalizeRegistrationType(type);

            if (normalizedType === "online") {
                return getCssVariable("--online-color");
            }

            if (normalizedType === "mail") {
                return getCssVariable("--mail-color");
            }

            if (normalizedType === "in person") {
                return getCssVariable("--in-person-color");
            }

            return getCssVariable("--muted-text");
        }

        function getUniqueTypeColors(entries) {
            return [
                ...new Set(
                    entries.map(entry =>
                        getTypeColor(
                            entry["Registration Type"]
                        )
                    )
                )
            ];
        }

        function getCssVariable(variableName) {
            return getComputedStyle(document.documentElement)
                .getPropertyValue(variableName)
                .trim();
        }

        /* =========================
           Popup
        ========================= */

        function openStatePopup(dateKey, state, entries) {
            const popup = document.getElementById("popup");
            const popupContent = document.getElementById(
                "popup-content"
            );

            const sortedEntries = [...entries].sort(
                compareRegistrationTypes
            );

            const dateLabel = formatDateKey(dateKey);

            let html = `
                <h2 id="popup-state" class="popup-state">
                    ${escapeHTML(state)}
                </h2>

                <p class="popup-date">
                    ${escapeHTML(dateLabel)}
                </p>
            `;

            sortedEntries.forEach(item => {
                const type = item["Registration Type"];
                const normalizedType =
                    normalizeRegistrationType(type);
                const color = getTypeColor(type);

                const mailBadgeClass =
                    normalizedType === "mail"
                        ? "mail-badge"
                        : "";

                const notes = String(item.Notes || "").trim();

                html += `
                    <div
                        class="deadline-entry"
                        style="--type-color: ${color};"
                    >
                        <div class="deadline-heading">
                            <span
                                class="deadline-badge ${mailBadgeClass}"
                            >
                                ${escapeHTML(formatTypeName(type))}
                            </span>

                            <a
                                class="more-info-link"
                                href="${escapeAttribute(item.Link)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                (More Info)
                            </a>
                        </div>

                        <p class="deadline-date">
                            <strong>Deadline:</strong>
                            ${escapeHTML(item.Deadline)}
                        </p>

                        ${
                            notes
                                ? `
                                    <p class="deadline-notes">
                                        ${escapeHTML(notes)}
                                    </p>
                                `
                                : ""
                        }
                    </div>
                `;
            });

            popupContent.innerHTML = html;
            popup.classList.add("is-open");

            document.body.style.overflow = "hidden";

            document.getElementById("close-popup").focus();
            
            if (dateKey === "2026-11-03") {
            
                html += `
                    <div class="election-info">
            
                        <h3>Election Day</h3>
            
                        <p>
                            Same-Day Voter Registration is available on Election Day in:
                        </p>
            
                        <ul>
                            ${sameDayRegistrationStates
                                .map(state => `<li>${state}</li>`)
                                .join("")}
                        </ul>
            
                    </div>
                `;
            
            }
        }

        function compareRegistrationTypes(a, b) {
            const typeOrder = {
                online: 1,
                mail: 2,
                "in person": 3
            };

            const firstType = normalizeRegistrationType(
                a["Registration Type"]
            );

            const secondType = normalizeRegistrationType(
                b["Registration Type"]
            );

            return (
                (typeOrder[firstType] || 99) -
                (typeOrder[secondType] || 99)
            );
        }

        function formatTypeName(type) {
            return normalizeRegistrationType(type)
                .split(" ")
                .map(word =>
                    word.charAt(0).toUpperCase() +
                    word.slice(1)
                )
                .join(" ");
        }

        function formatDateKey(dateKey) {
            const [year, month, day] =
                dateKey.split("-").map(Number);

            return new Intl.DateTimeFormat("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            }).format(new Date(year, month - 1, day));
        }

        function closePopup() {
            const popup = document.getElementById("popup");

            popup.classList.remove("is-open");
            document.body.style.overflow = "";
        }

        document
            .getElementById("close-popup")
            .addEventListener("click", closePopup);

        document
            .getElementById("popup")
            .addEventListener("click", event => {
                if (event.target.id === "popup") {
                    closePopup();
                }
            });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closePopup();
            }
        });

        /* =========================
           Error handling
        ========================= */

        function showLoadingError() {
            document.getElementById(
                "calendar-container"
            ).innerHTML = `
                <div class="error-message">
                    The registration deadlines could not be loaded.
                    Please refresh the page.
                </div>
            `;
        }

        /*
         * Escapes spreadsheet text before adding it to popup HTML.
         */
        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHTML(String(value || "").trim());
        }
    </script>
</body>

</html>
