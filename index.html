<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Voter Registration Deadlines</title>

    <!-- Calendar library -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


    <style>

        /* =========================
           Site Colors
        ========================= */

        :root {
            --cream: #F2EEDF;
            --blue: #5D8AA8;
            --red: #DE5452;
            --gold: #F4B942;
            --charcoal: #1F2430;
            --muted-text: #505761;
        }


        /* =========================
           Main Layout
        ========================= */

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: var(--cream);
            color: var(--charcoal);
        }


        #calendar-container {
            max-width: 1200px;
            margin: auto;
        }


        .month-calendar {
            background: white;
            padding: 20px;
            margin-bottom: 35px;
            border-radius: 15px;
        }


        /* =========================
           Popup Window
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.5);
        }


        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 25px;
            width: 80%;
            max-width: 600px;
            max-height: 75vh;
            overflow-y: auto;
            border-radius: 10px;
        }


        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }


        /* =========================
           Registration Type Colors
        ========================= */

        .online {
            background: var(--red);
        }


        .mail {
            background: var(--gold);
        }


        .inperson {
            background: var(--charcoal);
        }


        .badge {

            display: inline-block;
        
            color: white;
        
            padding: 4px 8px;
        
            border-radius: 5px;
        
            margin-right: 5px;
        
            font-size: 12px;
        
            font-weight: bold;
        
        }
        
        
        
        .deadline-entry {
        
            margin-bottom: 18px;
        
            line-height: 1.4;
        
        }
        
        
        
        .deadline-entry a {
        
            color: var(--blue);
        
            text-decoration: none;
        
            font-weight: bold;
        
        }
        
        
        
        .deadline-entry a:hover {
        
            color: var(--red);
        
        }
        
        
        
        .notes {
        
            color: var(--muted-text);
        
            font-size: 14px;
        
        }


        /* =========================
           Calendar Styling
        ========================= */

        .fc {
            --fc-border-color: #D8D3C4;
        }


        .fc-daygrid-day-number {
            color: var(--muted-text);
        }


        .fc-event {
            background: var(--blue);
            border: none;
        }


        .fc-event:hover {
            background: var(--red);
        }


        .fc-day-today {
            background: var(--cream) !important;
        }

    </style>

</head>


<body>


    <!-- Three month calendars -->

    <div id="calendar-container">

        <div id="september"></div>

        <div id="october"></div>

        <div id="november"></div>

    </div>



    <!-- Popup -->

    <div id="popup" class="modal">

        <div class="modal-content">

            <span class="close">&times;</span>

            <div id="popupText"></div>

        </div>

    </div>



<script>

    // =========================
    // Load spreadsheet data
    // =========================


    const csvURL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRIAU4CfDAlRhv0zDxdZngiqbdavP3sga8lvqxcinP3gjhvHtM2v6vPJbPGc6PZHCmMLFijZ_oDYrZX/pub?gid=1156287616&single=true&output=csv";


    let deadlineData = {};


    Papa.parse(csvURL, {

        download: true,

        header: true,


        complete: function(results) {


            results.data.forEach(row => {


                if (!row.State || !row.Deadline) {
                    return;
                }


                let date = new Date(row.Deadline);

                let key = date.toISOString().split("T")[0];


                if (!deadlineData[key]) {
                    deadlineData[key] = {};
                }


                if (!deadlineData[key][row.State]) {
                    deadlineData[key][row.State] = [];
                }


                deadlineData[key][row.State].push(row);


            });


            createCalendar();

        }

    });



    // =========================
    // Create calendars
    // =========================


    function createCalendar() {


        let months = [

            {
                id: "september",
                date: "2026-09-01"
            },

            {
                id: "october",
                date: "2026-10-01"
            },

            {
                id: "november",
                date: "2026-11-01"
            }

        ];



        months.forEach(month => {


            let calendar =
            new FullCalendar.Calendar(

                document.getElementById(month.id),

                {


                    initialView: "dayGridMonth",

                    initialDate: month.date,


                    headerToolbar: false,

                    height: "auto",

                    dayMaxEvents: true,



                    events: Object.keys(deadlineData).map(date => ({


                        title:
                        Object.keys(deadlineData[date]).join("\n"),


                        start: date,


                        extendedProps: {

                            details: deadlineData[date]

                        }


                    })),



                    eventContent: function(arg) {


                        return {

                            html:
                            arg.event.title.replace(/\n/g, "<br>")

                        };


                    },



                    eventClick: function(info) {


                        let html = "";

                        let states =
                        info.event.extendedProps.details;



                        Object.keys(states).forEach(state => {


                            html += `<h2>${state}</h2>`;



                            states[state].forEach(item => {

                                let type = item["Registration Type"];
                            
                                let colorClass = "";
                            
                            
                                if (type.toLowerCase() === "online") {
                                    colorClass = "online";
                                }
                            
                                else if (type.toLowerCase() === "mail") {
                                    colorClass = "mail";
                                }
                            
                                else if (type.toLowerCase() === "in person") {
                                    colorClass = "inperson";
                                }
                            
                            
                            
                                html += `
                            
                                    <div class="deadline-entry">
                            
                                        <span class="badge ${colorClass}">
                                            ${type}
                                        </span>
                            
                                        <a href="${item.Link}" target="_blank">
                                            (More Info)
                                        </a>
                            
                            
                                        <br>
                            
                                        <strong>
                                            Deadline:
                                        </strong>
                                        ${item.Deadline}
                            
                            
                                        ${
                                            item.Notes
                                            ?
                                            `<br><span class="notes">${item.Notes}</span>`
                                            :
                                            ""
                                        }
                            
                            
                                    </div>
                            
                                `;
                            
                            
                            });


                        });



                        document.getElementById("popupText").innerHTML = html;

                        document.getElementById("popup").style.display = "block";


                    }


                }

            );


            calendar.render();


        });


    }



    // Close popup

    document.querySelector(".close").onclick = function() {

        document.getElementById("popup").style.display = "none";

    };


</script>


</body>

</html>
